version: "3.8"

services:
  vn-buyer-guide:
    build:
      context: .
      dockerfile: Dockerfile
      target: production

    container_name: vn-buyer-guide-fe

    ports:
      - "80:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - API_BASE_URL=${API_BASE_URL}
      - API_BASE_PATH=${API_BASE_PATH}
      - NODE_ENV=production

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
